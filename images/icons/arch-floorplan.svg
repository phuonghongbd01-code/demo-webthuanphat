<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="800" height="800" role="img" aria-label="Architectural floorplan icon">
  <defs>
    <linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f3d7a1"/>
      <stop offset="45%" stop-color="#d4b06b"/>
      <stop offset="100%" stop-color="#b07b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="gloss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="back" cx="50%" cy="30%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#back)" />

  <!-- Subtle vignette glow -->
  <g opacity="0.08">
    <circle cx="100" cy="50" r="80" fill="#c59137"/>
  </g>

  <!-- Floorplan lines -->
  <g filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="24" y="30" width="152" height="140" rx="6"/>
    <path d="M24 80h152" />
    <path d="M100 30v140" />
    <path d="M24 140h60" />
    <path d="M116 140h60" />
    <path d="M64 80v60" />
    <circle cx="86" cy="110" r="4" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Specular highlight -->
  <g opacity="0.18" filter="url(#gloss)">
    <path d="M30 36c24-6 64-8 140 10" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  </g>
</svg>